<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="140" viewBox="0 0 600 140" role="img" aria-label="Animated tech stack">
  <desc>Animated tech stack: JS rotates, HTML pulses, CSS bounces, Git color-shifts.</desc>
  <g transform="translate(300,70)">
    <!-- JavaScript: rotation -->
    <g transform="translate(-225,0)">
      <g>
        <circle cx="0" cy="0" r="30" fill="#f7df1e" />
        <text x="0" y="6" font-family="Verdana,DejaVu Sans,Segoe UI,Arial" font-size="14" text-anchor="middle" fill="#000">JS</text>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite" />
      </g>
    </g>

    <!-- HTML: pulse (scale) -->
    <g transform="translate(-75,0)">
      <g>
        <circle cx="0" cy="0" r="30" fill="#e34f26" />
        <text x="0" y="6" font-family="Verdana,DejaVu Sans,Segoe UI,Arial" font-size="12" text-anchor="middle" fill="#fff">HTML</text>
        <animateTransform attributeName="transform" type="scale" values="1;1.25;1" dur="1.8s" repeatCount="indefinite" />
      </g>
    </g>

    <!-- CSS: vertical bounce -->
    <g transform="translate(75,0)">
      <g>
        <circle cx="0" cy="0" r="30" fill="#264de4" />
        <text x="0" y="6" font-family="Verdana,DejaVu Sans,Segoe UI,Arial" font-size="12" text-anchor="middle" fill="#fff">CSS</text>
        <animateTransform attributeName="transform" type="translate" values="0 -8;0 8;0 -8" dur="1.6s" repeatCount="indefinite" />
      </g>
    </g>

    <!-- Git: color shift -->
    <g transform="translate(225,0)">
      <g>
        <circle cx="0" cy="0" r="30" fill="#f05032">
          <animate attributeName="fill" values="#f05032;#e74c3c;#f05032" dur="3s" repeatCount="indefinite" />
        </circle>
        <text x="0" y="6" font-family="Verdana,DejaVu Sans,Segoe UI,Arial" font-size="12" text-anchor="middle" fill="#fff">GIT</text>
      </g>
    </g>
  </g>

  <!-- optional label centered below -->
  <text x="300" y="118" font-family="Verdana,DejaVu Sans,Segoe UI,Arial" font-size="14" text-anchor="middle" fill="#94a3b8">JavaScript • HTML • CSS • Git</text>
</svg>
